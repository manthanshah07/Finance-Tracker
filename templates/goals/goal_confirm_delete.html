{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Goal - FinanceTracker{% endblock %}

{% block content %}
<div class="container-fluid p-0" style="max-width: 500px;">
    <div class="finance-card text-center py-4">
        <div class="text-danger mb-3" style="font-size: 3rem;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h4 class="fw-bold mb-3">Delete Savings Goal</h4>
        <p class="text-secondary mb-4">Are you sure you want to permanently delete the savings goal "<strong>{{ goal.name }}</strong>"? This action cannot be undone.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex align-items-center justify-content-center gap-3">
                <a href="{% url 'goal_list' %}" class="btn btn-outline-secondary px-4 fw-semibold">Cancel</a>
                <button type="submit" class="btn btn-danger px-4 fw-semibold">Delete Permanently</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
